<!DOCTYPE html>
<html lang="en" data-tv-theme="aurora" data-layout="spotlight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AX-NEWS TV</title>
  <meta name="description" content="AX-NEWS on a screen: the news of your topics, around the clock, in English.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050a16">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg?v={{ asset_version }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v={{ asset_version }}">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/tv.css?v={{ asset_version }}">
  <script type="application/json" id="ax-taxonomy">{{ taxonomy_json|safe }}</script>
  <script type="application/json" id="tv-boot">{"token": {{ screen_token|tojson }}, "version": {{ app_version|tojson }}, "asset": {{ asset_version|tojson }}}</script>
</head>
<body>
<div class="tv" id="tv">
  <div class="tv-bg" aria-hidden="true"><div class="tv-bg-art"></div><div class="tv-bg-story"></div><div class="tv-bg-veil"></div></div>

  <header class="tv-top drift">
    <div class="tv-brand">
      <img class="tv-mark" src="/assets/brand/mark.svg?v={{ asset_version }}" alt="" width="66" height="45">
      <div class="tv-channel">
        <div class="tv-channel-name"><span><b>AX</b>·NEWS</span><span class="tv-live" aria-label="Live">LIVE</span></div>
        <div class="tv-channel-title" data-title>Tech Intelligence</div>
      </div>
    </div>
    <div class="tv-counts" data-counts></div>
    <div class="tv-clock" data-clock-wrap>
      <div class="tv-time" data-clock>00:00</div>
      <div class="tv-date" data-date></div>
    </div>
  </header>

  <main class="tv-stage" id="stage" aria-live="polite"></main>

  <div class="tv-alert hidden drift" data-alert>
    <div class="tv-alert-label"><span data-alert-label>ALERT</span><small data-alert-count></small></div>
    <div class="tv-alert-body" data-alert-body></div>
    <div class="tv-alert-impact hidden" data-alert-impact></div>
    <div class="tv-alert-qr" data-alert-qr></div>
  </div>

  <footer class="tv-ticker" data-ticker>
    <div class="tv-ticker-label">LATEST</div>
    <div class="tv-ticker-track"><div class="tv-ticker-inner" data-ticker-inner></div></div>
  </footer>

  <div class="tv-justin" data-justin><span class="tv-justin-label">Just in</span><span data-justin-text></span></div>
  <div class="tv-status" data-status></div>
  <div class="tv-hint" data-hint>F full screen · L layout · T theme · Space pause · ← → stories</div>
  <div class="tv-loading" data-loading>
    <img src="/assets/brand/axiom-dark.svg?v={{ asset_version }}" alt="AXIOM" width="600" height="280">
    <div class="tv-loading-bar"><span></span></div>
    <div class="tv-loading-text" data-loading-text>Tuning in…</div>
  </div>
</div>
<script nonce="{{ csp_nonce }}" src="/assets/js/tv.js?v={{ asset_version }}"></script>
</body>
</html>
