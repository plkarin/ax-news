name: tests

on:
  push:
    branches: [main, tv-rework]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ax_news
          POSTGRES_PASSWORD: ax_news
          POSTGRES_DB: ax_news_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ax_news"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AXNEWS_TEST_DATABASE_URL: postgresql://ax_news:ax_news@localhost:5432/ax_news_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: The database of a new install (README, Installation)
        run: |
          for m in 001_schema 003_personal_sources 004_catalog_tv 005_articles_lookups; do
            psql "$AXNEWS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "migrations/$m.sql"
          done
      - name: Every Python file compiles
        run: python -m compileall -q backend tools *.py
      - name: Every shell script parses
        run: for f in *.sh deploy/*.sh; do bash -n "$f"; done
      - run: python -m pytest -q tests
